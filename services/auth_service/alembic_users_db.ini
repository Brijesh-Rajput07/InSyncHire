# LOCATION: services/auth_service/alembic_users_db.ini

[alembic]
script_location = alembic_users_db
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url comes from USERS_DB_DSN at runtime (see
# alembic_users_db/env.py) -- never hardcoded here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
