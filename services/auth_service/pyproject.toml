# LOCATION: services/auth_service/pyproject.toml

[project]
name = "insynchire-auth-service"
version = "0.1.0"
description = "Auth Service: signup (company + candidate), OTP, login, encrypted httpOnly cookies (InSyncHire M2)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "cryptography>=42.0",
    "pyjwt[crypto]>=2.9",
    "redis>=5.0",
    "dnspython>=2.6",
    "bcrypt>=4.1",
    "pydantic[email]>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "aiosqlite>=0.20",
    "fakeredis>=2.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["auth_service*"]
