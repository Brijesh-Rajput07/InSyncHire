# LOCATION: services/notification_service/pyproject.toml

[project]
name = "insynchire-notification-service"
version = "0.1.0"
description = "Notification Service: headless Kafka consumer, sends email for notification-relevant events (InSyncHire M7)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "cryptography>=42.0",
    "pydantic[email]>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["notification_service*"]