# LOCATION: services/migration_service/alembic_tenant.ini

[alembic]
script_location = alembic_tenant
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is injected at runtime per-tenant by db_admin.py --
# this is the ONE migration suite run against every tenant_<id>_db.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
