# LOCATION: services/migration_service/alembic_global.ini

[alembic]
script_location = alembic_global
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is intentionally left unset here -- it's injected at
# runtime from GLOBAL_DB_DSN (see alembic_global/env.py), never
# hardcoded in this file, per Section 10i.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
