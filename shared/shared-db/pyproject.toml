# LOCATION: shared/shared-db/pyproject.toml

[project]
name = "insynchire-shared-db"
version = "0.1.0"
description = "Shared async DB helpers (engine/session factories, RLS activation, GUID type, connection-string crypto) for InSyncHire microservices"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared", "shared.db"]
